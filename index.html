<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#476c5b"><link rel="manifest" href="manifest.webmanifest"><title>Mon Assistant Maison</title><style>body{font-family:-apple-system,BlinkMacSystemFont,sans-serif;margin:0;background:#f6f8f5;color:#23372c}header{background:#476c5b;color:white;padding:25px 20px}main{padding:18px;max-width:650px;margin:auto}.card{background:white;border-radius:17px;padding:17px;margin:12px 0;box-shadow:0 2px 10px #0000000a}button,input,select,textarea{font:inherit}button{border:0;border-radius:12px;padding:11px 14px;background:#476c5b;color:white;margin:4px}input,select,textarea{box-sizing:border-box;width:100%;border:1px solid #ccd8ce;border-radius:10px;padding:12px;margin:6px 0}nav{display:flex;overflow:auto;gap:4px;padding:9px;background:#e8efe9;position:sticky;top:0}nav button{white-space:nowrap;background:#d1e1d5;color:#234331}nav button.active{background:#476c5b;color:white}.muted{color:#65776a;font-size:.9em}.item{padding:10px 0;border-bottom:1px solid #edf0ed}.danger{color:#9a3333}.hidden{display:none}label{display:block;margin-top:10px;font-weight:600}small{color:#65776a}</style></head><body><header><h1>🏡 Mon Assistant Maison</h1><div>Ton foyer, tes repas, ton organisation</div></header><nav id="nav"></nav><main id="app"></main><script>
const defaults={budget:150,people:3,tasks:[{name:'Passer l’aspirateur',day:'Lundi',done:false},{name:'Faire les lessives',day:'Mardi',done:false},{name:'Entretenir le jardin',day:'Samedi',done:false}],meals:{Lundi:['Bowl quinoa, pois chiches et légumes','Fruit et amandes','Omelette aux épinards et pommes de terre'],Mardi:['Salade de lentilles et légumes','Compote et noix','Curry de tofu et riz'],Mercredi:['Pâtes aux haricots blancs','Fruit et yaourt végétal adapté','Chili sin carne'],Jeudi:['Riz sauté aux œufs et légumes','Banane et purée d’amande','Soupe de lentilles corail'],Vendredi:['Wraps au houmous','Fruit et graines','Dahl de lentilles'],Samedi:['Pommes de terre et légumes rôtis','Compote et noix','Tofu aux légumes'],Dimanche:['Quinoa aux haricots rouges','Fruit et tartines','Riz aux pois chiches']},groceries:[],notes:[]};
let state;try{state=JSON.parse(localStorage.getItem('maison-v1'))||structuredClone(defaults)}catch(e){state=structuredClone(defaults)}const days=Object.keys(defaults.meals),slots=['Midi','Goûter','Souper'];let tab='Accueil';function save(){localStorage.setItem('maison-v1',JSON.stringify(state))}function el(tag,text,cls){const x=document.createElement(tag);if(text!==undefined)x.textContent=text;if(cls)x.className=cls;return x}function btn(text,fn){const b=el('button',text);b.onclick=fn;return b}function card(parent,title){let c=el('section',undefined,'card');if(title)c.append(el('h2',title));parent.append(c);return c}function field(parent,label,value,onchange,type='text'){parent.append(el('label',label));let i=el('input');i.type=type;i.value=value;i.onchange=()=>{onchange(i.value);save()};parent.append(i)}function render(){let nav=document.getElementById('nav'),app=document.getElementById('app');nav.replaceChildren();app.replaceChildren();['Accueil','Planning','Repas','Courses','Assistant','Réglages'].forEach(t=>{let b=btn(t,()=>{tab=t;render()});if(t===tab)b.className='active';nav.append(b)});if(tab==='Accueil'){let c=card(app,'Bienvenue 🌿');c.append(el('p','3 personnes · Sans viande ni poisson · Œufs autorisés'));c.append(el('p','⚠️ Profil 1 : allergie aux protéines de lait','danger'));c.append(el('p','Budget alimentaire : '+state.budget+' CHF/semaine'));c=card(app,'À faire');state.tasks.filter(t=>!t.done).slice(0,5).forEach(t=>c.append(el('div',t.day+' · '+t.name,'item')));c=card(app,'Menus du lundi');slots.forEach((s,i)=>c.append(el('div',s+' : '+state.meals.Lundi[i],'item')))}
if(tab==='Planning'){let c=card(app,'Ajouter une tâche');field(c,'Tâche','',v=>{window.newTask=v});let sel=el('select');days.forEach(d=>{let o=el('option',d);o.value=d;sel.append(o)});c.append(sel,btn('Ajouter',()=>{if(!window.newTask?.trim())return;state.tasks.push({name:window.newTask.trim(),day:sel.value,done:false});save();render()}));days.forEach(day=>{let x=card(app,day);state.tasks.forEach((t,i)=>{if(t.day!==day)return;let r=el('div',undefined,'item'),ch=el('input');ch.type='checkbox';ch.style.width='auto';ch.checked=t.done;ch.onchange=()=>{t.done=ch.checked;save();render()};r.append(ch,document.createTextNode(' '+t.name+' '),btn('Supprimer',()=>{state.tasks.splice(i,1);save();render()}));x.append(r)})})}
if(tab==='Repas'){let c=card(app,'Menus personnalisables');c.append(el('p','Tu peux remplacer librement chaque repas. Ces idées ne sont pas des recettes nutritionnellement validées.','muted'));days.forEach(d=>{let x=card(app,d);slots.forEach((slot,i)=>field(x,slot,state.meals[d][i],v=>{state.meals[d][i]=v}))})}
if(tab==='Courses'){let c=card(app,'Liste de courses');c.append(el('p','Ajoute les ingrédients nécessaires à tes recettes. La génération automatique viendra avec le catalogue de recettes.','muted'));let inp=el('input');inp.placeholder='Ex. Myrtilles, 250 g';c.append(inp,btn('Ajouter',()=>{if(inp.value.trim()){state.groceries.push({name:inp.value.trim(),done:false});save();render()}}));state.groceries.forEach((g,i)=>{let r=el('div',undefined,'item'),check=el('input');check.type='checkbox';check.style.width='auto';check.checked=g.done;check.onchange=()=>{g.done=check.checked;save()};r.append(check,document.createTextNode(' '+g.name+' '),btn('×',()=>{state.groceries.splice(i,1);save();render()}));c.append(r)})}
if(tab==='Assistant'){
let c=card(app,'🎙️ Assistant maison');c.append(el('p','Parle ou écris une demande. Cette version gratuite reconnaît certaines commandes : ajouter une tâche, remplacer un repas par une recette du catalogue, ajouter des courses. Ce n’est pas encore une IA conversationnelle.','muted'));
let inp=el('textarea');inp.rows=4;inp.placeholder='Ex. Demain, je veux un gâteau aux myrtilles au goûter. / Ajoute nettoyer les vitres jeudi. / Ajoute du riz aux courses.';c.append(inp);
let status=el('p','','muted');c.append(status);
c.append(btn('🎤 Parler',()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){status.textContent='Reconnaissance vocale non disponible dans ce navigateur. Utilise le micro du clavier de ton iPhone pour dicter.';inp.focus();return}try{let rec=new SR();rec.lang='fr-FR';rec.interimResults=false;rec.onresult=e=>{inp.value=e.results[0][0].transcript;status.textContent='Texte reconnu. Vérifie-le puis touche « Analyser ma demande ».'};rec.onerror=e=>status.textContent='Micro indisponible ('+e.error+'). Tu peux dicter avec le clavier.';rec.start();status.textContent='Je t’écoute…'}catch(e){status.textContent='Utilise le micro du clavier pour dicter.'}}));
c.append(btn('✨ Analyser ma demande',()=>{let result=interpret(inp.value);status.textContent=result.message;if(result.action){let old=c.querySelector('.proposal');if(old)old.remove();let proposal=el('div',undefined,'proposal');proposal.append(el('p',result.summary));proposal.append(btn('✅ Confirmer la modification',()=>{result.action();save();render();let cc=document.querySelector('#app .card');cc.append(el('p','Modification enregistrée.','muted'))}));proposal.append(btn('Annuler',()=>proposal.remove()));c.append(proposal)}}));
c.append(el('p','⚠️ Allergie aux protéines de lait : aucune recette ou marque n’est garantie sûre. Vérifie les étiquettes, les ingrédients et les risques de contact croisé avant consommation.','danger'));
c.append(el('h3','Exemples à essayer'));['Demain je veux un gâteau aux myrtilles au goûter','Ajoute nettoyer les vitres jeudi','Ajoute du riz aux courses'].forEach(t=>c.append(btn(t,()=>{inp.value=t;status.textContent='Appuie sur « Analyser ma demande ».'})));
}
if(tab==='Réglages'){let c=card(app,'Foyer');field(c,'Budget hebdomadaire (CHF)',state.budget,v=>{state.budget=Number(v)||0},'number');field(c,'Nombre de personnes',state.people,v=>{state.people=Number(v)||1},'number');c.append(el('p','Alimentation familiale : sans viande ni poisson. Œufs autorisés.','muted'));c.append(el('p','Profil 1 : allergie aux protéines de lait. Profils 2 et 3 : à préciser.','danger'));c.append(el('p','Important : aucune recette ou étiquette ne doit être considérée comme sûre sans vérification des allergènes et du risque de contact croisé.','muted'));c.append(btn('Exporter mes données',()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download='mon-assistant-maison-sauvegarde.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}))}}
const catalog=[{terms:['myrtille','myrtilles'],name:'Gâteau aux myrtilles sans produits laitiers (recette indicative)',ingredients:['Myrtilles — 150 g','Farine — 160 g','Œufs — 2','Sucre — 65 g','Huile végétale — 60 ml','Boisson végétale adaptée — 100 ml','Levure chimique — 1/2 sachet'],instructions:'Mélanger les ingrédients secs, puis les œufs, l’huile et la boisson végétale. Incorporer les myrtilles. Verser dans un petit moule et cuire environ 30–35 min à 180 °C ; vérifier la cuisson. Préparation ~15 min, cuisson supplémentaire.'}];
function normalize(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')}
function interpret(raw){let t=normalize(raw.trim());if(!t)return {message:'Écris ou dicte une demande.'};let day=days.find(d=>t.includes(normalize(d)))|| (t.includes('demain')?days[(new Date().getDay()+6+1)%7]:null);let slot=/dessert|gouter|collation/.test(t)?1:/souper|soir|diner/.test(t)?2:0;
let recipe=catalog.find(r=>r.terms.some(k=>t.includes(k)));if(recipe){if(!day)return {message:'Indique un jour (par exemple « jeudi » ou « demain »).'};return {message:'Recette du catalogue trouvée. Vérifie avant de confirmer.',summary:'Remplacer le '+slots[slot].toLowerCase()+' de '+day+' par « '+recipe.name+' » et ajouter les ingrédients à la liste de courses. '+recipe.instructions+' Vérifie impérativement les allergènes de chaque produit.',action:()=>{state.meals[day][slot]=recipe.name;recipe.ingredients.forEach(n=>{if(!state.groceries.some(g=>g.name===n))state.groceries.push({name:n,done:false})})}}}
let task=t.match(/(?:ajoute|ajouter|planifie|prevois|faire|je dois)\s+(.+)/);if(task&& !/course|acheter/.test(t)){let d=day||'Lundi';let name=raw.trim().replace(/^(ajoute|ajouter|planifie|prévois|faire|je dois)\s+/i,'').replace(/\s+(lundi|mardi|mercredi|jeudi|vendredi|samedi|dimanche)\s*$/i,'');return {message:'Tâche reconnue.',summary:'Ajouter « '+name+' » au planning du '+d+'.',action:()=>state.tasks.push({name,day:d,done:false})}}
if(/course|acheter|ajoute/.test(t)){let name=raw.trim().replace(/^(ajoute|ajouter|acheter)\s+/i,'').replace(/\s+(a|à|sur|dans)\s+(la|les|ma|mes)\s+courses?\s*$/i,'');return {message:'Article reconnu.',summary:'Ajouter « '+name+' » à la liste de courses.',action:()=>state.groceries.push({name,done:false})}}
return {message:'Je ne sais pas encore exécuter cette demande. Essaie une commande exemple ; aucune modification n’a été faite.'}}
render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
